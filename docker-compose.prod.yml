# Production stack: web (gunicorn) + PostgreSQL + Redis, optional Caddy for HTTPS.
#
#   cp .env.prod.example .env.prod   # fill in SECRET_KEY, ALLOWED_HOSTS, passwords
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   with your own domain and automatic HTTPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile https up -d --build

services:
  web:
    build: .
    image: proflens-web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-proflens}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proflens}
      REDIS_URL: redis://redis:6379/0
      # gunicorn may trust X-Forwarded-* headers from other containers (Caddy / host proxy)
      FORWARDED_ALLOW_IPS: "*"
    # published on localhost only: the outside world talks to Caddy / your hosting proxy.
    # Set WEB_BIND=0.0.0.0 only if gunicorn really must be reachable directly.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proflens}
      POSTGRES_USER: ${POSTGRES_USER:-proflens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB
      -c work_mem=8MB -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proflens} -d ${POSTGRES_DB:-proflens}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
