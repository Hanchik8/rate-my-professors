{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}"><strong>{{ field.label }}</strong></label>
  {% if field.help_text %}<small id="{{ field.auto_id }}_help">{{ field.help_text }}</small>{% endif %}
  {{ field }}{{ field.errors }}
</div>
{% endfor %}
